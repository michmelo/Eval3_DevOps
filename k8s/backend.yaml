apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-backend
  namespace: default
spec:
  replicas: 2 # Cumple Alta Disponibilidad (Rúbrica)
  selector:
    matchLabels:
      app: tienda-backend
  template:
    metadata:
      labels:
        app: tienda-backend
    spec:
      containers:
      - name: backend
        image: 056958103903.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:v1
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "tienda-db-service" # Se conectará al servicio de la BD en producción
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "admin123"
        - name: DB_NAME
          value: "tienda_perritos"
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-backend-service
  namespace: default
spec:
  selector:
    app: tienda-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP # Puerto interno, solo accesible dentro del clúster por seguridad