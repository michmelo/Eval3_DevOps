apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-backend
  template:
    metadata:
      labels:
        app: tienda-backend
    spec:
      containers:
      - name: backend
        image: 440480743039.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:v1
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "tienda-db-service"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "admin123"
        - name: DB_NAME
          value: "tienda_perritos"
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-backend-service
spec:
  selector:
    app: tienda-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
  spec:
      imagePullSecrets:
      - name: ecr-registry-secret  # <-- Esta línea es la que hace la magia
      containers:
      - name: backend
        image: 440480743039.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:v1
        ...